<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2050" viewBox="0 0 2200 2050" role="img" aria-labelledby="title desc">
<title id="title">Parking Lot System UML based on supplied diagram</title>
<desc id="desc">Class diagram for the parking lot singleton, floors, spots, tickets, vehicle subclasses, parking strategies, fee strategies, and three workflow diagrams.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#23394d"/></marker>
  <marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1L12 7L1 13Z" fill="#fff" stroke="#23394d" stroke-width="1.5"/></marker>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#162b3b}.title{font-size:34px;font-weight:750}.sub{font-size:16px;fill:#52697c}.panel{fill:#f7fafc;stroke:#d5e0e8;stroke-width:2}.pTitle{font-size:22px;font-weight:700;fill:#173b56}.cls{fill:#fff;stroke:#354f64;stroke-width:2;rx:10}.hd{fill:#dceef8}.hdGreen{fill:#dff3eb}.hdGold{fill:#fff0d5}.hdPurple{fill:#e9e4fb}.name{font-size:18px;font-weight:700}.stereo{font-size:12px;fill:#50677a}.member{font-size:14px}.muted{font-size:12px;fill:#596f80}.sep{stroke:#bfccd5;stroke-width:1}.assoc{fill:none;stroke:#23394d;stroke-width:2;marker-end:url(#arrow)}.impl{fill:none;stroke:#23394d;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#hollow)}.relTxt{font-size:12px;font-weight:600;fill:#334e62}.flow{fill:#fff;stroke:#46657e;stroke-width:2;rx:12}.start{fill:#e2f5eb;stroke:#39845d;stroke-width:2}.end{fill:#e2effb;stroke:#3d78a6;stroke-width:2}.decision{fill:#fff3d1;stroke:#b98819;stroke-width:2}.error{fill:#ffefec;stroke:#c55b4e;stroke-width:2}.fa{fill:none;stroke:#334e62;stroke-width:2.2;marker-end:url(#arrow)}.ft{font-size:14px;font-weight:700;text-anchor:middle}.fs{font-size:12px;fill:#52697c;text-anchor:middle}
  </style>
</defs>
<rect width="2200" height="2050" fill="#fff"/>
<text x="55" y="62" class="title">Smart Parking Lot — UML from Your Design</text>
<text x="55" y="92" class="sub">Plain Java + Maven • class relationships, Strategy pattern, and runtime flow</text>

<rect x="35" y="120" width="2130" height="1000" class="panel" rx="18"/>
<text x="65" y="160" class="pTitle">1. Class diagram — ownership, interfaces, and inheritance</text>
<text x="65" y="185" class="muted">Filled diamond = composition • plain arrow = association/dependency • dashed hollow arrow = implements or extends</text>

<!-- Relationship connectors, behind the classes -->
<path d="M365 270H710" class="assoc"/><text x="505" y="256" class="relTxt">starts / configures</text>
<path d="M855 390V430H760V470" class="assoc"/><text x="770" y="448" class="relTxt">floors</text>
<path d="M1155 390V445H1230V470" class="assoc"/><text x="1165" y="438" class="relTxt">activeTickets</text>
<path d="M710 310H565V535H430" class="assoc"/><text x="465" y="520" class="relTxt">feeStrategy</text>
<path d="M1300 260H1515V455H1570" class="assoc"/><text x="1390" y="246" class="relTxt">parkingStrategy</text>
<path d="M760 690V770" class="assoc"/><polygon points="760,690 752,702 768,702" fill="#23394d"/><text x="773" y="743" class="relTxt">owns spots</text>
<path d="M960 850H1040" class="assoc"/><text x="966" y="837" class="relTxt">parked vehicle</text>
<path d="M1040 585H1005V815H960" class="assoc"/><text x="973" y="718" class="relTxt">ticket spot</text>
<path d="M1230 700V790" class="assoc"/><text x="1242" y="755" class="relTxt">ticket vehicle</text>
<path d="M1420 900H1490V860H1530" class="assoc"/><text x="1440" y="886" class="relTxt">size</text>
<path d="M230 770V745H245V730" class="impl"/><path d="M230 930H35V645H60" class="impl"/><text x="275" y="760" class="relTxt">implemented by</text>
<path d="M1572 605V575H1845V540" class="impl"/><path d="M1847 605V540" class="impl"/><path d="M2092 605V575H1845V540" class="impl"/>
<path d="M220 950V1010H235V1025" class="assoc"/><text x="248" y="1002" class="relTxt">vehicle sizes</text>
<path d="M892 1025V1000H1110V950" class="impl"/><path d="M1097 1025V950" class="impl"/><path d="M1302 1025V1000H1350V950" class="impl"/>
<text x="840" y="420" class="relTxt">1</text><text x="770" y="464" class="relTxt">0..*</text>
<text x="1170" y="420" class="relTxt">1</text><text x="1240" y="462" class="relTxt">0..*</text>
<text x="775" y="713" class="relTxt">1</text><text x="775" y="762" class="relTxt">0..*</text>
<text x="1010" y="600" class="relTxt">0..*</text><text x="965" y="802" class="relTxt">1</text>
<text x="1243" y="722" class="relTxt">0..*</text><text x="1243" y="786" class="relTxt">1</text>
<text x="970" y="842" class="relTxt">0..1</text><text x="1010" y="842" class="relTxt">0..1</text>
<text x="1503" y="438" class="relTxt">1</text><text x="1550" y="438" class="relTxt">1</text>

<!-- Demo -->
<g><rect x="55" y="220" width="310" height="110" class="cls"/><path d="M55 230Q55 220 65 220H355Q365 220 365 230V255H55Z" class="hdGold"/><text x="210" y="246" text-anchor="middle" class="name">ParkingLotDemo</text><line x1="55" y1="255" x2="365" y2="255" class="sep"/><text x="75" y="285" class="member">+ main(String[] args): void</text><text x="75" y="308" class="muted">Builds demo lot and starts console</text></g>

<!-- Main singleton -->
<g><rect x="710" y="205" width="590" height="185" class="cls"/><path d="M710 215Q710 205 720 205H1290Q1300 205 1300 215V240H710Z" class="hdGreen"/><text x="1005" y="232" text-anchor="middle" class="name">ParkingLotSystem «singleton»</text><line x1="710" y1="240" x2="1300" y2="240" class="sep"/><text x="730" y="266" class="member">- instance: ParkingLotSystem (static final)</text><text x="730" y="288" class="member">- floors: List&lt;ParkingFloor&gt;</text><text x="730" y="310" class="member">- activeTickets: Map&lt;String, ParkingTicket&gt;</text><text x="730" y="332" class="member">- parkingStrategy: ParkingStrategy • feeStrategy: FeeStrategy</text><line x1="710" y1="345" x2="1300" y2="345" class="sep"/><text x="730" y="370" class="member">+ getInstance() • addFloor(floor)</text><text x="1010" y="370" class="member">+ parkVehicle(vehicle) • unparkVehicle(license)</text></g>

<!-- Fee strategy and concrete policies -->
<g><rect x="60" y="560" width="370" height="170" class="cls"/><path d="M60 570Q60 560 70 560H420Q430 560 430 570V610H60Z" class="hdPurple"/><text x="245" y="583" text-anchor="middle" class="stereo">«interface»</text><text x="245" y="603" text-anchor="middle" class="name">FeeStrategy</text><line x1="60" y1="610" x2="430" y2="610" class="sep"/><text x="80" y="642" class="member">+ calculateFee(ticket): double</text><text x="80" y="667" class="muted">Policy contract used on checkout</text></g>
<g><rect x="55" y="770" width="350" height="135" class="cls"/><path d="M55 780Q55 770 65 770H395Q405 770 405 780V805H55Z" class="hdGold"/><text x="230" y="797" text-anchor="middle" class="name">FlatRateFeeStrategy</text><line x1="55" y1="805" x2="405" y2="805" class="sep"/><text x="75" y="835" class="member">- ratePerHour: double</text><text x="75" y="860" class="member">+ calculateFee(ticket): double</text><text x="75" y="884" class="muted">One hourly rate for every size</text></g>
<g><rect x="55" y="930" width="350" height="145" class="cls"/><path d="M55 940Q55 930 65 930H395Q405 930 405 940V965H55Z" class="hdGold"/><text x="230" y="957" text-anchor="middle" class="name">VehicleBasedFeeStrategy</text><line x1="55" y1="965" x2="405" y2="965" class="sep"/><text x="75" y="994" class="member">- HOURLY_RATES: Map&lt;VehicleSize, Double&gt;</text><text x="75" y="1019" class="member">+ calculateFee(ticket): double</text><text x="75" y="1047" class="muted">Rate depends on vehicle size</text></g>

<!-- Floor, ticket, spot -->
<g><rect x="560" y="470" width="400" height="220" class="cls"/><path d="M560 480Q560 470 570 470H950Q960 470 960 480V505H560Z" class="hdGreen"/><text x="760" y="497" text-anchor="middle" class="name">ParkingFloor</text><line x1="560" y1="505" x2="960" y2="505" class="sep"/><text x="580" y="535" class="member">- floorNumber: int</text><text x="580" y="558" class="member">- spots: Map&lt;String, ParkingSpot&gt;</text><line x1="560" y1="575" x2="960" y2="575" class="sep"/><text x="580" y="605" class="member">+ findAvailableSpot(vehicle): Optional&lt;ParkingSpot&gt;</text><text x="580" y="630" class="member">+ addSpot(spot): void</text><text x="580" y="655" class="member">+ displayAvailability(): void</text></g>
<g><rect x="1040" y="470" width="380" height="230" class="cls"/><path d="M1040 480Q1040 470 1050 470H1410Q1420 470 1420 480V505H1040Z" class="hdGreen"/><text x="1230" y="497" text-anchor="middle" class="name">ParkingTicket</text><line x1="1040" y1="505" x2="1420" y2="505" class="sep"/><text x="1060" y="535" class="member">- spot: ParkingSpot</text><text x="1060" y="558" class="member">- ticketId: String</text><text x="1060" y="581" class="member">- entryTimestamp: long</text><text x="1060" y="604" class="member">- exitTimestamp: long</text><text x="1060" y="627" class="member">- vehicle: Vehicle</text><line x1="1040" y1="644" x2="1420" y2="644" class="sep"/><text x="1060" y="673" class="member">+ markExited(timestamp): void</text></g>
<g><rect x="560" y="770" width="400" height="240" class="cls"/><path d="M560 780Q560 770 570 770H950Q960 770 960 780V805H560Z" class="hdGreen"/><text x="760" y="797" text-anchor="middle" class="name">ParkingSpot</text><line x1="560" y1="805" x2="960" y2="805" class="sep"/><text x="580" y="835" class="member">- spotSize: VehicleSize</text><text x="580" y="858" class="member">- spotId: String</text><text x="580" y="881" class="member">- parkedVehicle: Vehicle?</text><line x1="560" y1="900" x2="960" y2="900" class="sep"/><text x="580" y="928" class="member">+ canFitVehicle(vehicle): boolean</text><text x="580" y="952" class="member">+ parkVehicle(vehicle) • unparkVehicle()</text><text x="580" y="975" class="member">+ isAvailable(): boolean</text></g>

<!-- Vehicle hierarchy -->
<g><rect x="1040" y="790" width="380" height="160" class="cls"/><path d="M1040 800Q1040 790 1050 790H1410Q1420 790 1420 800V825H1040Z" class="hdGreen"/><text x="1230" y="817" text-anchor="middle" class="name">Vehicle «abstract»</text><line x1="1040" y1="825" x2="1420" y2="825" class="sep"/><text x="1060" y="855" class="member">- size: VehicleSize</text><text x="1060" y="878" class="member">- licenseNumber: String</text><line x1="1040" y1="895" x2="1420" y2="895" class="sep"/><text x="1060" y="925" class="member">+ getSize() • getLicenseNumber()</text></g>
<g><rect x="820" y="1025" width="145" height="70" class="cls"/><path d="M820 1035Q820 1025 830 1025H955Q965 1025 965 1035V1060H820Z" class="hdGreen"/><text x="892" y="1052" text-anchor="middle" class="name">Bike</text><line x1="820" y1="1060" x2="965" y2="1060" class="sep"/><text x="892" y="1083" text-anchor="middle" class="member">SMALL</text></g>
<g><rect x="1025" y="1025" width="145" height="70" class="cls"/><path d="M1025 1035Q1025 1025 1035 1025H1160Q1170 1025 1170 1035V1060H1025Z" class="hdGreen"/><text x="1097" y="1052" text-anchor="middle" class="name">Car</text><line x1="1025" y1="1060" x2="1170" y2="1060" class="sep"/><text x="1097" y="1083" text-anchor="middle" class="member">MEDIUM</text></g>
<g><rect x="1230" y="1025" width="145" height="70" class="cls"/><path d="M1230 1035Q1230 1025 1240 1025H1365Q1375 1025 1375 1035V1060H1230Z" class="hdGreen"/><text x="1302" y="1052" text-anchor="middle" class="name">Truck</text><line x1="1230" y1="1060" x2="1375" y2="1060" class="sep"/><text x="1302" y="1083" text-anchor="middle" class="member">LARGE</text></g>
<g><rect x="1530" y="860" width="290" height="155" class="cls"/><path d="M1530 870Q1530 860 1540 860H1810Q1820 860 1820 870V905H1530Z" class="hdPurple"/><text x="1675" y="883" text-anchor="middle" class="stereo">«enumeration»</text><text x="1675" y="902" text-anchor="middle" class="name">VehicleSize</text><line x1="1530" y1="905" x2="1820" y2="905" class="sep"/><text x="1675" y="933" text-anchor="middle" class="member">SMALL • MEDIUM • LARGE</text><text x="1675" y="970" text-anchor="middle" class="muted">Shared by vehicle, spot, and rates</text></g>

<!-- Parking strategy abstraction and implementations -->
<g><rect x="1570" y="390" width="550" height="150" class="cls"/><path d="M1570 400Q1570 390 1580 390H2110Q2120 390 2120 400V435H1570Z" class="hdPurple"/><text x="1845" y="413" text-anchor="middle" class="stereo">«interface»</text><text x="1845" y="432" text-anchor="middle" class="name">ParkingStrategy</text><line x1="1570" y1="435" x2="2120" y2="435" class="sep"/><text x="1590" y="467" class="member">+ findSpot(floors, vehicle): Optional&lt;ParkingSpot&gt;</text><text x="1590" y="495" class="muted">Encapsulates search order; swappable at runtime</text></g>
<g><rect x="1470" y="605" width="205" height="105" class="cls"/><path d="M1470 615Q1470 605 1480 605H1665Q1675 605 1675 615V640H1470Z" class="hdGold"/><text x="1572" y="632" text-anchor="middle" class="name">NearestFirst</text><line x1="1470" y1="640" x2="1675" y2="640" class="sep"/><text x="1572" y="669" text-anchor="middle" class="member">lowest floor first</text><text x="1572" y="693" text-anchor="middle" class="muted">then first fitting spot</text></g>
<g><rect x="1745" y="605" width="205" height="105" class="cls"/><path d="M1745 615Q1745 605 1755 605H1940Q1950 605 1950 615V640H1745Z" class="hdGold"/><text x="1847" y="632" text-anchor="middle" class="name">BestFit</text><line x1="1745" y1="640" x2="1950" y2="640" class="sep"/><text x="1847" y="669" text-anchor="middle" class="member">smallest fitting spot</text><text x="1847" y="693" text-anchor="middle" class="muted">floor/ID tie break</text></g>
<g><rect x="2020" y="605" width="145" height="105" class="cls"/><path d="M2020 615Q2020 605 2030 605H2155Q2165 605 2165 615V640H2020Z" class="hdGold"/><text x="2092" y="632" text-anchor="middle" class="name">Farthest</text><line x1="2020" y1="640" x2="2165" y2="640" class="sep"/><text x="2092" y="669" text-anchor="middle" class="member">highest floor</text><text x="2092" y="693" text-anchor="middle" class="muted">then spot ID</text></g>

<text x="65" y="1100" class="muted">Relationship summary: lot owns floors and tracks open tickets; floors contain spots; tickets connect one vehicle to one spot; Bike/Car/Truck extend Vehicle; concrete strategy classes implement their interfaces.</text>

<!-- Workflows -->
<rect x="35" y="1150" width="2130" height="850" class="panel" rx="18"/>
<text x="65" y="1190" class="pTitle">2. Runtime flow — shapes show decisions and arrows show call order</text>

<text x="65" y="1235" class="name">A. Vehicle entry</text>
<rect x="65" y="1260" width="180" height="75" class="start" rx="36"/><text x="155" y="1291" class="ft">IN command</text><text x="155" y="1313" class="fs">type + license</text>
<path d="M245 1298H295" class="fa"/>
<rect x="305" y="1260" width="215" height="75" class="flow"/><text x="412" y="1291" class="ft">ParkingLotDemo</text><text x="412" y="1313" class="fs">create Bike / Car / Truck</text>
<path d="M520 1298H570" class="fa"/>
<rect x="580" y="1260" width="250" height="75" class="flow"/><text x="705" y="1291" class="ft">ParkingLotSystem</text><text x="705" y="1313" class="fs">reject duplicate active plate</text>
<path d="M830 1298H880" class="fa"/>
<rect x="890" y="1260" width="250" height="75" class="flow"/><text x="1015" y="1291" class="ft">ParkingStrategy</text><text x="1015" y="1313" class="fs">search floors for a fit</text>
<path d="M1140 1298H1190" class="fa"/>
<polygon points="1300,1253 1410,1298 1300,1343 1190,1298" class="decision"/><text x="1300" y="1294" class="ft">Spot found?</text><text x="1300" y="1314" class="fs">available + size fits</text>
<path d="M1410 1298H1460" class="fa"/><text x="1422" y="1282" class="fs">yes</text>
<rect x="1470" y="1260" width="260" height="75" class="flow"/><text x="1600" y="1291" class="ft">Occupy spot</text><text x="1600" y="1313" class="fs">create UUID ticket + entry time</text>
<path d="M1730 1298H1780" class="fa"/>
<rect x="1790" y="1260" width="320" height="75" class="end" rx="14"/><text x="1950" y="1291" class="ft">Store active ticket</text><text x="1950" y="1313" class="fs">keyed by normalized license</text>
<path d="M1300 1343V1375H1015" class="fa"/><text x="1055" y="1368" class="fs">no → return empty / lot full</text>

<line x1="65" y1="1410" x2="2130" y2="1410" class="sep"/>
<text x="65" y="1450" class="name">B. Vehicle exit</text>
<rect x="65" y="1475" width="180" height="75" class="start" rx="36"/><text x="155" y="1506" class="ft">OUT command</text><text x="155" y="1528" class="fs">license number</text>
<path d="M245 1513H295" class="fa"/>
<rect x="305" y="1475" width="250" height="75" class="flow"/><text x="430" y="1506" class="ft">Find active ticket</text><text x="430" y="1528" class="fs">in singleton map</text>
<path d="M555 1513H605" class="fa"/>
<polygon points="715,1468 825,1513 715,1558 605,1513" class="decision"/><text x="715" y="1509" class="ft">Ticket found?</text><text x="715" y="1529" class="fs">active session</text>
<path d="M825 1513H875" class="fa"/><text x="837" y="1497" class="fs">yes</text>
<rect x="885" y="1475" width="250" height="75" class="flow"/><text x="1010" y="1506" class="ft">Stamp exit time</text><text x="1010" y="1528" class="fs">epoch milliseconds</text>
<path d="M1135 1513H1185" class="fa"/>
<rect x="1195" y="1475" width="250" height="75" class="flow"/><text x="1320" y="1506" class="ft">FeeStrategy</text><text x="1320" y="1528" class="fs">calculate fee from ticket</text>
<path d="M1445 1513H1495" class="fa"/>
<rect x="1505" y="1475" width="250" height="75" class="flow"/><text x="1630" y="1506" class="ft">Release ParkingSpot</text><text x="1630" y="1528" class="fs">remove active ticket</text>
<path d="M1755 1513H1805" class="fa"/>
<rect x="1815" y="1475" width="295" height="75" class="end" rx="14"/><text x="1962" y="1506" class="ft">Return and print fee</text><text x="1962" y="1528" class="fs">vehicle leaves lot</text>
<path d="M715 1558V1590H430" class="fa"/><text x="465" y="1583" class="fs">no → report no active ticket</text>

<line x1="65" y1="1625" x2="2130" y2="1625" class="sep"/>
<text x="65" y="1665" class="name">C. Availability and strategy changes</text>
<rect x="65" y="1690" width="200" height="75" class="start" rx="36"/><text x="165" y="1721" class="ft">STATUS</text><text x="165" y="1743" class="fs">console request</text>
<path d="M265 1728H325" class="fa"/>
<rect x="335" y="1690" width="310" height="75" class="flow"/><text x="490" y="1721" class="ft">System → Floors → Spots</text><text x="490" y="1743" class="fs">count available spots per floor</text>
<path d="M645 1728H705" class="fa"/>
<rect x="715" y="1690" width="260" height="75" class="end" rx="14"/><text x="845" y="1721" class="ft">Print availability</text><text x="845" y="1743" class="fs">live in-memory occupancy</text>
<rect x="1120" y="1690" width="990" height="75" class="flow"/><text x="1615" y="1721" class="ft">PARKING_STRATEGY / FEE_STRATEGY commands</text><text x="1615" y="1743" class="fs">console selects another implementation; system setters swap policy for subsequent operations</text>

<rect x="65" y="1810" width="2045" height="145" fill="#edf4f8" stroke="#d0dde7" rx="12"/>
<text x="90" y="1845" class="name">Key UML and runtime notes</text>
<text x="90" y="1876" class="member">• VehicleSize order is SMALL &lt; MEDIUM &lt; LARGE. Spots fit vehicles of equal or smaller size. Best-fit picks the smallest fitting available spot.</text>
<text x="90" y="1903" class="member">• Nearest-first means lowest floor number; farthest-first means highest floor number. Within a floor, spot ID breaks ties.</text>
<text x="90" y="1930" class="member">• Singleton + synchronized park/unpark guards one JVM only. The design uses in-memory state, so restarting clears floors/tickets configured by the demo.</text>
</svg>
